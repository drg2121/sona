<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sona">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Sona</title>
<style>
:root{
  --bg:#110f1c; --bg2:#181528; --card:#1f1b33; --card2:#29243f; --ink:#f3f1fc; --muted:#a8a3c6; --faint:#6f6a92;
  --line:#2f2a4a; --accent:#9d95ff; --accent-ink:#13102a; --brand:#534AB7; --ok:#62c48f; --shadow:0 10px 30px rgba(5,3,20,.55);
  --serif:"New York","Iowan Old Style",Charter,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --nav-h:62px; --mini-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f5fb; --bg2:#ecebf6; --card:#ffffff; --card2:#f0eefa; --ink:#1b1830; --muted:#625d7d; --faint:#a19cbb;
    --line:#e3e0f1; --accent:#534AB7; --accent-ink:#fff; --brand:#534AB7; --ok:#2f7d4f; --shadow:0 10px 30px rgba(40,30,110,.14); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}
.hidden{display:none!important}

/* ---------- shell ---------- */
.view{max-width:720px;margin:0 auto;padding:0 18px calc(var(--nav-h) + var(--mini-h) + var(--safe-b) + 24px)}
.appbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0 -18px 6px;padding:calc(var(--safe-t) + 10px) 18px 10px;background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:21px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand img{width:32px;height:32px;border-radius:9px;box-shadow:0 2px 8px color-mix(in srgb,var(--brand) 35%,transparent)}
h1.big{font:700 30px/1.15 var(--serif);margin:8px 0 18px;letter-spacing:-.01em}
.sub2{color:var(--muted);font-size:15px;margin:-12px 0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font:700 30px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.hello{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.hello .mark{width:22px;height:22px;border-radius:6px}
.avatar{text-decoration:none;flex:none;width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--accent)}
h2.sec{font:650 19px/1.2 var(--sans);margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec a{font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.empty{color:var(--muted);font-size:15px;padding:18px;background:var(--card);border-radius:16px;text-align:center}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);display:flex;justify-content:center}
nav.tabs .in{display:flex;width:100%;max-width:720px}
nav.tabs a{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--faint);text-decoration:none;font-size:11px;font-weight:600}
nav.tabs a.on{color:var(--accent)}

/* ---------- covers ---------- */
.cover{--h:20;position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 70% at 85% 0%,hsl(calc(var(--h) + 20) 70% 62% / .45),transparent 60%),
             linear-gradient(160deg,hsl(var(--h) 48% 40%),hsl(calc(var(--h) + 30) 55% 15%));
  box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08)}
.cover::before{content:"";position:absolute;inset:7%;border:1px solid rgba(255,255,255,.28);border-radius:4px}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.08) 70%,transparent)}
.cover .ct{position:absolute;inset:14% 13% 12%;display:flex;flex-direction:column;justify-content:space-between;text-align:center}
.cover .ctitle{font:700 1em/1.12 var(--serif);text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.cover .cauth{font-size:.48em;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.cover .cmark{display:flex;justify-content:center;opacity:.9}
.cover .cmark svg{width:1.1em;height:1.1em}

/* ---------- cards / grids ---------- */
.continue{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.continue .cover{width:92px;font-size:13px;flex:none}
.continue .meta{flex:1;min-width:0}
.continue .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.continue .t{font:700 19px/1.2 var(--serif);margin:4px 0 2px}
.continue .c{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.playbig{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent)}
.playbig svg{width:26px;height:26px}

.shelf{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 8px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf .tile{width:118px;flex:none;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 16px}
.tile{display:block;text-align:left;color:inherit;text-decoration:none}
.tile .cover{font-size:15px}
.tile .tt{font-weight:650;font-size:14px;margin-top:9px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ts{font-size:12px;color:var(--muted);margin-top:2px}
.tile .bar{margin-top:6px;height:3px}
.badge{position:absolute;right:8px;top:8px;z-index:2;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:3px 7px;font-size:11px;font-weight:700;display:flex;gap:4px;align-items:center}
.badge svg{width:12px;height:12px}

.search{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:0 14px;margin-bottom:12px}
.search input{flex:1;border:0;background:none;padding:13px 0;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 18px;padding:0 18px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg)}

/* ---------- book page ---------- */
.bookhero{position:relative;text-align:center;padding-top:6px}
.back{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.bookhero .cover{width:min(52vw,220px);margin:6px auto 18px;font-size:21px}
.bookhero h1{font:700 26px/1.15 var(--serif);margin:0 0 6px;text-wrap:balance}
.bookhero .by{color:var(--muted);font-size:15px}
.bookhero .facts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0 6px;font-size:13px;color:var(--muted)}
.bookhero .facts span{background:var(--card);padding:5px 10px;border-radius:99px}
.actions{display:flex;gap:10px;margin:18px 0 8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;font-weight:700;font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sq{flex:none;width:52px;background:var(--card)}
.btn.sq.on{color:#ff6b8a}
.progline{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.chs{margin-top:20px;background:var(--card);border-radius:18px;overflow:hidden}
.chrow{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.chrow:last-child{border-bottom:0}
.chrow .n{width:26px;text-align:center;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums;flex:none}
.chrow .x{flex:1;min-width:0}
.chrow .x b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.chrow .x small{color:var(--muted);font-size:13px}
.chrow .x .bar{height:3px;margin-top:6px}
.chrow.cur{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.chrow.cur .n{color:var(--accent)}
.chrow .done{color:var(--ok)}

/* ---------- history / profile ---------- */
.day{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 8px}
.hrow{display:flex;gap:14px;align-items:center;padding:10px;border-radius:14px;width:100%;text-align:left}
.hrow:active{background:var(--card)}
.hrow .cover{width:44px;font-size:7px;border-radius:6px;flex:none}
.hrow .x{flex:1;min-width:0}
.hrow .x b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .x small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .when{font-size:12px;color:var(--faint);flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 6px}
.stat{background:var(--card);border-radius:16px;padding:14px 10px;text-align:center}
.stat b{display:block;font:700 22px/1.1 var(--serif)}
.stat span{font-size:12px;color:var(--muted)}
.set{background:var(--card);border-radius:18px;overflow:hidden}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px}
.seg button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--ok)} .switch.on::after{left:23px}
.linkbtn{color:var(--accent);font-weight:650}
.note{font-size:14px;color:var(--muted);background:var(--card);border-radius:16px;padding:14px 16px;line-height:1.5}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;padding:calc(var(--safe-t) + 30px) 24px 40px}
.login .logo{width:84px;height:84px;border-radius:22px;margin:0 auto 18px;display:block;box-shadow:var(--shadow)}
.login h1{font:700 32px/1.1 var(--serif);text-align:center;margin:0 0 6px}
.login p.sub{text-align:center;color:var(--muted);margin:0 0 28px}
.field{display:block;margin-bottom:12px}
.field input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;outline:none}
.field input:focus{border-color:var(--accent)}
.login .btn{width:100%;margin-top:6px;flex:none}
.login .alt{text-align:center;margin-top:18px;font-size:15px;color:var(--muted)}
.gbtn{width:100%;background:#fff;color:#1f1f1f;border:1px solid var(--line);gap:12px;margin-bottom:6px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:#ff8a8a;font-size:14px;min-height:20px;margin:4px 2px 6px}

/* ---------- mini player ---------- */
.mini{position:fixed;left:8px;right:8px;bottom:calc(var(--nav-h) + var(--safe-b) + 6px);z-index:19;max-width:704px;margin:0 auto;
  background:var(--card2);border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;overflow:hidden}
.mini .cover{width:40px;font-size:6px;border-radius:6px;flex:none}
.mini .x{flex:1;min-width:0;cursor:pointer}
.mini .x b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .x small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .pp{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.mini .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--accent)}

/* ---------- full player ---------- */
.player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);
  overflow:hidden;visibility:hidden;pointer-events:none;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s linear .32s;padding:calc(var(--safe-t) + 8px) 22px calc(var(--safe-b) + 16px)}
.player.open{transform:none;visibility:visible;pointer-events:auto;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s}
.player .bgblur{position:absolute;inset:0;z-index:-1;opacity:.55;filter:blur(60px) saturate(1.3);transform:scale(1.4)}
.player .phead{display:flex;align-items:center;justify-content:space-between;height:48px}
.player .phead .lbl{font-size:13px;font-weight:650;color:var(--muted);text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;max-width:520px;width:100%;margin:0 auto}
.pcover{width:min(70vw,44vh,340px);margin:0 auto;font-size:26px;border-radius:14px}
.ptitles{margin:26px 0 8px}
.ptitles b{display:block;font:700 22px/1.2 var(--serif)}
.ptitles span{color:var(--muted);font-size:15px}
.reader{flex:1;overflow-y:auto;min-height:0;font:19px/1.65 var(--serif);padding:8px 2px 40vh;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(transparent,#000 6%,#000 90%,transparent);mask-image:linear-gradient(transparent,#000 6%,#000 90%,transparent)}
.reader p{margin:0 0 16px} .reader h3{font:700 1.05em/1.3 var(--serif);margin:22px 0 12px;color:var(--accent)}
.reader span{color:var(--faint);transition:color .25s;cursor:pointer;border-radius:4px}
.reader span.read{color:var(--muted)}
.reader span.cur{color:var(--ink);background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.player.text .pcover,.player.text .ptitles{display:none}
.player:not(.text) .reader{display:none}
.player.text .pbody{justify-content:flex-start}
.scrub{margin-top:14px}
.scrub input{width:100%;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
.scrub input::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:linear-gradient(90deg,var(--ink) var(--p,0%),var(--line) var(--p,0%))}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);margin-top:-5.5px}
.scrub input::-moz-range-track{height:5px;border-radius:9px;background:var(--line)}
.scrub input::-moz-range-progress{height:5px;border-radius:9px;background:var(--ink)}
.scrub input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.controls{display:flex;align-items:center;justify-content:space-between;margin:14px 0 18px}
.controls .iconbtn svg{width:30px;height:30px}
.skip{position:relative;width:56px;height:56px;display:grid;place-items:center}
.skip svg{width:34px;height:34px}
.skip em{position:absolute;font-style:normal;font-size:10px;font-weight:800;top:21px}
.pplay{width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.pplay svg{width:34px;height:34px}
.tools{display:flex;justify-content:space-around;align-items:center}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;color:var(--muted);min-width:64px}
.tool.on{color:var(--accent)}
.tool .v{font-size:15px;font-weight:800;color:var(--ink);height:24px;display:grid;place-items:center}

/* ---------- sheets ---------- */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.sheetbg.open{opacity:1;pointer-events:auto}
.sheet:not(.open){visibility:hidden;transition:transform .25s,visibility 0s linear .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 18px calc(var(--safe-b) + 18px);transform:translateY(100%);transition:transform .25s;max-height:75vh;overflow:auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 10px;font-size:17px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px}
.opt:last-child{border-bottom:0}
.opt.on{color:var(--accent);font-weight:700}
#ptr{position:fixed;left:50%;top:calc(var(--safe-t) + 8px);z-index:30;width:42px;height:42px;border-radius:50%;background:var(--card);
  box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);transform:translate(-50%,-70px);opacity:0;
  transition:transform .25s,opacity .25s;pointer-events:none}
#ptr.spin svg{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--mini-h) + var(--safe-b) + 20px);transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
@media (min-width:760px){ .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))} }
</style>
</head>
<body>
<main id="root"><div class="loading">Se încarcă…</div></main>

<div class="mini hidden" id="mini">
  <div class="cover" id="miniCover"></div>
  <div class="x" id="miniOpen"><b id="miniTitle"></b><small id="miniSub"></small></div>
  <button class="pp" id="miniBack" aria-label="Înapoi 15 secunde"></button>
  <button class="pp" id="miniPlay" aria-label="Redă"></button>
  <div class="prog" id="miniProg"></div>
</div>

<nav class="tabs hidden" id="tabs"><div class="in">
  <a href="#/home" data-tab="home"></a><a href="#/library" data-tab="library"></a>
  <a href="#/history" data-tab="history"></a><a href="#/profile" data-tab="profile"></a>
</div></nav>

<section class="player" id="player" aria-label="Player">
  <div class="bgblur" id="pBlur"></div>
  <div class="phead">
    <button class="iconbtn" id="pClose" aria-label="Închide"></button>
    <div class="lbl" id="pLabel"></div>
    <button class="iconbtn" id="pChapters" aria-label="Capitole"></button>
  </div>
  <div class="pbody">
    <div class="cover pcover" id="pCover"></div>
    <div class="ptitles"><b id="pTitle"></b><span id="pSub"></span></div>
    <div class="reader" id="reader"></div>
  </div>
  <div style="max-width:520px;width:100%;margin:0 auto">

<script type="module">
/* =====================================================================

const store = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- icons ---------- */
const P = {
  play:'<path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/>',

/* ---------- formatting ---------- */
const fmtClock = s => { s = Math.max(0, Math.floor(s||0)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`; };
const fmtDur = s => { s = Math.round((s||0)/60); if(s < 1) return "sub 1 min"; const h = Math.floor(s/60), m = s%60;
  return h ? `${h} h${m ? " " + m + " min" : ""}` : `${m} min`; };
const hueOf = str => { let h = 7; for(const c of String(str)) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
const dayLabel = ts => { const d = new Date(ts), t = new Date(); const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const b = new Date(t.getFullYear(), t.getMonth(), t.getDate()); const diff = Math.round((b - a)/864e5);
  return diff === 0 ? "Azi" : diff === 1 ? "Ieri" : d.toLocaleDateString("ro-RO", {weekday:"long", day:"numeric", month:"long"}); };
const hhmm = ts => new Date(ts).toLocaleTimeString("ro-RO", {hour:"2-digit", minute:"2-digit"});

/* =====================================================================
   Backends
   ===================================================================== */
const FIREBASE_SDK = "https://www.gstatic.com/firebasejs/10.14.1";
const LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1" || new URLSearchParams(location.search).has("local");

function LocalBackend(){
  let user = null;
  const key = () => "ab_state_" + user.uid;
  return {
    mode: "local",
    async init(cb){ user = store.get("ab_local_user", null); cb(user); },
    async signIn(name){ user = {uid: "local-" + name.toLowerCase().replace(/\W+/g,"-"), name, email: "pe acest Mac"}; store.set("ab_local_user", user); return user; },
    async signUp(name){ return this.signIn(name); },
    async signOut(){ user = null; store.set("ab_local_user", null); },
    async resetPassword(){},
    async books(){ const r = await fetch("/api/catalog"); return r.json(); },
    async audioUrl(bookId, ch){ return `/audio/${ch.id}.${ch.ext || "mp3"}`; },
    async transcript(bookId, ch){ const r = await fetch(`/api/item/${ch.id}`); return r.json(); },
    async state(){ return store.get(key(), {}); },
    async write(path, value){ const st = store.get(key(), {}); setPath(st, path, value); store.set(key(), st); },
    async addHistory(entry){ const id = "h" + Date.now().toString(36); await this.write("history/" + id, entry); return id; },
    async addListened(sec){ const st = store.get(key(), {}); st.stats = st.stats || {}; st.stats.sec = (st.stats.sec||0) + sec; store.set(key(), st); },
  };
}
function setPath(obj, path, value){
  const parts = path.split("/"); let o = obj;
  for(let i = 0; i < parts.length - 1; i++){ o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === "object") ? o[parts[i]] : {}; }
  const last = parts[parts.length-1];
  if(value === null) delete o[last]; else if(value && typeof value === "object" && !Array.isArray(value) && typeof o[last] === "object") Object.assign(o[last], value); else o[last] = value;
}

async function FirebaseBackend(cfg){
  const [{initializeApp}, A, D] = await Promise.all([
    import(`${FIREBASE_SDK}/firebase-app.js`), import(`${FIREBASE_SDK}/firebase-auth.js`),
    import(`${FIREBASE_SDK}/firebase-database.js`)]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app), db = D.getDatabase(app);
  const me = () => auth.currentUser;
  const val = async p => (await D.get(D.ref(db, p))).val();
  const uref = p => D.ref(db, `ab/users/${me().uid}/${p}`);
  const wrapUser = u => u && {uid: u.uid, name: u.displayName || (u.email||"").split("@")[0], email: u.email};
  return {
    mode: "firebase",
    init(cb){ A.onAuthStateChanged(auth, u => cb(wrapUser(u))); },
    async signIn(email, pass){ return wrapUser((await A.signInWithEmailAndPassword(auth, email, pass)).user); },
    async google(){
      const prov = new A.GoogleAuthProvider(); prov.setCustomParameters({prompt: "select_account"});
      try{ return wrapUser((await A.signInWithPopup(auth, prov)).user); }
      catch(e){ if(e.code === "auth/operation-not-supported-in-this-environment"){ await A.signInWithRedirect(auth, prov); return null; } throw e; }
    },
    async signUp(email, pass, name){ const c = await A.createUserWithEmailAndPassword(auth, email, pass);
      if(name) await A.updateProfile(c.user, {displayName: name}); return wrapUser(c.user); },
    async signOut(){ await A.signOut(auth); },
    async resetPassword(email){ await A.sendPasswordResetEmail(auth, email); },
    async books(){ return (await val("ab/books")) || {}; },
    async audioUrl(bookId, ch){ if(!ch.audio) throw new Error("capitol fără audio"); return ch.audio; },
    async transcript(bookId, ch){ const t = await val(`ab/texts/${bookId}/${ch.id}`); if(!t) throw new Error("fără text"); return JSON.parse(t); },
    async state(){ return (await val(`ab/users/${me().uid}`)) || {}; },
    async write(path, value){ await D.set(uref(path), value); },
    async addHistory(entry){ const r = D.push(uref("history")); await D.set(r, entry); return r.key; },
    async addListened(sec){ await D.update(uref("stats"), {sec: D.increment(sec)}); },
    /* access: new accounts ask, the admin approves from Profil */
    async isAdmin(){ return !!(await val(`ab/admins/${me().uid}`)); },
    /* the very first account becomes the administrator */
    async claimAdminIfNone(){ if(await val("ab/admins")) return false; await D.set(D.ref(db, `ab/admins/${me().uid}`), true); return true; },
    async requestAccess(name){ const u = me(); await D.set(D.ref(db, `ab/requests/${u.uid}`), {email: u.email, name: name || u.displayName || "", at: Date.now()}); },
    async requests(){ return (await val("ab/requests")) || {}; },
    async allowedList(){ return (await val("ab/allowed")) || {}; },
    async approve(uid, info){ await D.set(D.ref(db, `ab/allowed/${uid}`), {email: info.email || "", name: info.name || "", at: Date.now()});
      await D.set(D.ref(db, `ab/requests/${uid}`), null); },
    async deny(uid){ await D.set(D.ref(db, `ab/requests/${uid}`), null); },
    async revoke(uid){ await D.set(D.ref(db, `ab/allowed/${uid}`), null); },
  };
}

/* =====================================================================
   State
   ===================================================================== */
let B = null;            // backend
let USER = null;
let BOOKS = {};          // id -> book
let ST = {};             // user state: pos, fav, last, prefs, stats, history
const DEF_PREFS = {speed: 1, back: 15, fwd: 30, autoNext: true, textSize: 19};
const prefs = () => Object.assign({}, DEF_PREFS, ST.prefs || {});
function chaptersOf(id){
  const b = BOOKS[id]; if(!b) return [];
  return Object.entries(b.chapters || {}).map(([cid, c]) => ({id: cid, ...c}))
    .sort((a, b) => (a.order||0) - (b.order||0) || String(a.title).localeCompare(b.title));
}
function posOf(cid){ return (ST.pos || {})[cid] || null; }
function chapterDone(c){ const p = posOf(c.id); return !!(p && (p.done || (c.dur && p.t >= c.dur - 3))); }
function bookProgress(id){
  const chs = chaptersOf(id); const total = chs.reduce((s,c)=>s+(c.dur||0),0) || 1;
  const heard = chs.reduce((s,c)=>{ const p = posOf(c.id); return s + (chapterDone(c) ? (c.dur||0) : Math.min(p?.t||0, c.dur||0)); }, 0);
  return {pct: Math.min(1, heard/total), left: Math.max(0, total - heard), total, started: heard > 5};
}
function resumePoint(id){
  const chs = chaptersOf(id); if(!chs.length) return null;
  const last = ST.last && ST.last.book === id ? chs.find(c => c.id === ST.last.ch) : null;
  if(last && !chapterDone(last)) return {ch: last, t: posOf(last.id)?.t || 0};
  if(last){ const i = chs.indexOf(last); if(chs[i+1]) return {ch: chs[i+1], t: posOf(chs[i+1].id)?.t || 0}; }
  const started = chs.find(c => !chapterDone(c) && (posOf(c.id)?.t || 0) > 0);
  if(started) return {ch: started, t: posOf(started.id).t};
  const first = chs.find(c => !chapterDone(c));
  return first ? {ch: first, t: 0} : {ch: chs[0], t: 0};
}
async function save(path, value){ setPath(ST, path, value); try{ await B.write(path, value); }catch(e){ console.warn("save", path, e); } }

/* =====================================================================
   Covers
   ===================================================================== */
function coverHTML(id, extraClass = "", badge = ""){
  const b = BOOKS[id] || {title: "?"};
  return `<div class="cover ${extraClass}" style="--h:${b.hue ?? hueOf(b.title)}">${badge}
    <div class="ct"><div class="cmark">${icon("wave")}</div><div class="ctitle">${esc(b.title)}</div><div class="cauth">${esc(b.author || (b.lang === "ro" ? "carte audio" : "audiobook"))}</div></div></div>`;
}
const artCache = {};
function coverArt(id){
  if(artCache[id]) return artCache[id];
  const b = BOOKS[id] || {title: "?"}; const h = b.hue ?? hueOf(b.title);
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 512, 512); gr.addColorStop(0, `hsl(${h} 48% 40%)`); gr.addColorStop(1, `hsl(${(h+30)%360} 55% 15%)`);
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = "rgba(255,255,255,.3)"; g.lineWidth = 3; g.strokeRect(34, 34, 444, 444);
  g.fillStyle = "#fff"; g.textAlign = "center"; g.font = "bold 50px Georgia, serif";
  const words = b.title.split(/\s+/), lines = []; let line = "";
  for(const w of words){ const t = line ? line + " " + w : w; if(g.measureText(t).width > 380 && line){ lines.push(line); line = w; } else line = t; }
  lines.push(line);
  const y0 = 256 - (lines.length - 1) * 30; lines.forEach((l, i) => g.fillText(l, 256, y0 + i * 60));
  return artCache[id] = c.toDataURL("image/png");
}

/* =====================================================================
   Player
   ===================================================================== */
const audio = $("#audio");
const PL = {book: null, ch: null, list: [], cues: [], spans: [], histId: null, histAt: 0, lastTick: 0, unsent: 0, lastSave: 0,
            sleepAt: 0, sleepEnd: false, nextUrl: null, textOn: store.get("ab_text", false), userScroll: 0};

async function playChapter(bookId, chId, {t = null, autoplay = true, open = false} = {}){
  const list = chaptersOf(bookId); const ch = list.find(c => c.id === chId) || list[0]; if(!ch) return;
  const same = PL.ch && PL.ch.id === ch.id && audio.src;
  PL.book = bookId; PL.list = list; PL.ch = ch; PL.histId = null;
  updateNowPlaying();
  if(open) openPlayer();
  if(!same){
    let url = PL.nextUrl && PL.nextUrl.id === ch.id ? PL.nextUrl.url : null;
    try{ url = url || await B.audioUrl(bookId, ch); }catch(e){ toast("Nu pot încărca audio: " + (e.code || e.message)); return; }
    audio.src = url;
    audio.playbackRate = prefs().speed;
    const start = t ?? (chapterDone(ch) ? 0 : (posOf(ch.id)?.t || 0));
    const seekTo = () => { if(start > 1 && start < (audio.duration || ch.dur || 1e9) - 2) audio.currentTime = start; };
    if(audio.readyState >= 1) seekTo(); else audio.addEventListener("loadedmetadata", seekTo, {once: true});
    loadTranscript();
    prefetchNext();
  } else if(t != null){ audio.currentTime = t; }
  save("last", {book: bookId, ch: ch.id, at: Date.now()});
  if(autoplay){ try{ await audio.play(); }catch(e){ /* needs a tap on iOS */ } }
}
async function prefetchNext(){
  const i = PL.list.findIndex(c => c.id === PL.ch.id), nx = PL.list[i+1];
  PL.nextUrl = null;
  if(nx){ try{ PL.nextUrl = {id: nx.id, url: await B.audioUrl(PL.book, nx)}; }catch(e){} }
}
function nextChapter(dir = 1){
  const i = PL.list.findIndex(c => c.id === PL.ch.id), nx = PL.list[i + dir];
  if(nx) playChapter(PL.book, nx.id, {t: dir < 0 ? 0 : null});
  else if(dir < 0) audio.currentTime = 0;
}
function togglePlay(){ if(!PL.ch) return; audio.paused ? audio.play().catch(()=>{}) : audio.pause(); }
function skip(sec){ if(!PL.ch) return; audio.currentTime = Math.max(0, Math.min((audio.duration||0) - 0.5, audio.currentTime + sec)); persist(true); }

function persist(force){
  if(!PL.ch) return;
  const now = Date.now();
  if(!force && now - PL.lastSave < 10000) return;
  PL.lastSave = now;
  const d = audio.duration || PL.ch.dur || 0, t = audio.currentTime;
  save(`pos/${PL.ch.id}`, {t: Math.round(t*10)/10, d: Math.round(d), at: now, book: PL.book, done: d > 0 && t >= d - 3});
  save("last", {book: PL.book, ch: PL.ch.id, at: now});
  if(PL.histId) B.write(`history/${PL.histId}/to`, Math.round(t)).then(() => B.write(`history/${PL.histId}/at`, now)).catch(()=>{});
  if(PL.unsent >= 5){ const s = Math.round(PL.unsent); PL.unsent = 0; ST.stats = ST.stats || {}; ST.stats.sec = (ST.stats.sec||0) + s; B.addListened(s).catch(()=>{}); }
}

audio.addEventListener("play", async () => {
  PL.lastTick = performance.now();
  const recent = PL.histId && Date.now() - PL.histAt < 5*60*1000;
  if(!recent){
    const entry = {book: PL.book, ch: PL.ch.id, from: Math.round(audio.currentTime), to: Math.round(audio.currentTime), at: Date.now()};
    try{ PL.histId = await B.addHistory(entry); setPath(ST, "history/" + PL.histId, entry); }catch(e){}
  }
  PL.histAt = Date.now(); renderPlayState();
});
audio.addEventListener("pause", () => { persist(true); PL.histAt = Date.now(); renderPlayState(); });
audio.addEventListener("timeupdate", () => {
  if(!audio.paused){ const now = performance.now(); const dt = (now - PL.lastTick)/1000; PL.lastTick = now; if(dt > 0 && dt < 3) PL.unsent += dt; PL.histAt = Date.now(); }
  if(PL.sleepAt && Date.now() >= PL.sleepAt){ PL.sleepAt = 0; audio.pause(); renderSleep(); toast("Somn: redarea s-a oprit"); }
  renderProgress(); persist(false); highlight();
});
audio.addEventListener("ended", () => {
  save(`pos/${PL.ch.id}`, {t: Math.round(audio.duration||PL.ch.dur||0), d: Math.round(audio.duration||0), at: Date.now(), book: PL.book, done: true});
  persist(true);
  if(PL.sleepEnd){ PL.sleepEnd = false; renderSleep(); toast("Somn: sfârșit de capitol"); return; }
  const i = PL.list.findIndex(c => c.id === PL.ch.id), nx = PL.list[i+1];
  if(nx && prefs().autoNext){
    // switch source right away (prefetched URL) so playback continues with the screen locked
    if(PL.nextUrl && PL.nextUrl.id === nx.id){ PL.ch = nx; audio.src = PL.nextUrl.url; audio.playbackRate = prefs().speed; audio.play().catch(()=>{});
      PL.histId = null; updateNowPlaying(); loadTranscript(); prefetchNext(); save("last", {book: PL.book, ch: nx.id, at: Date.now()}); }
    else playChapter(PL.book, nx.id, {t: 0});
  } else if(!nx){ toast("Ai terminat cartea 🎉"); render(); }
});
audio.addEventListener("ratechange", () => { $("#speedV").textContent = fmtSpeed(audio.playbackRate); mediaPos(); });
audio.addEventListener("loadedmetadata", mediaPos);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") persist(true); });
window.addEventListener("pagehide", () => persist(true));

/* lock screen / headphones / car */
function mediaPos(){ try{ if(audio.duration) navigator.mediaSession.setPositionState({duration: audio.duration, playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, audio.duration)}); }catch(e){} }
function setupMediaSession(){
  if(!("mediaSession" in navigator)) return;
  const ms = navigator.mediaSession, h = (a, f) => { try{ ms.setActionHandler(a, f); }catch(e){} };
  h("play", () => audio.play()); h("pause", () => audio.pause());
  h("seekbackward", d => skip(-(d.seekOffset || prefs().back))); h("seekforward", d => skip(d.seekOffset || prefs().fwd));
  h("previoustrack", () => nextChapter(-1)); h("nexttrack", () => nextChapter(1));
  h("seekto", d => { audio.currentTime = d.seekTime; mediaPos(); });
}
function updateNowPlaying(){
  const b = BOOKS[PL.book]; if(!b || !PL.ch) return;
  const idx = PL.list.findIndex(c => c.id === PL.ch.id) + 1;
  $("#mini").classList.remove("hidden");
  $("#miniCover").outerHTML = coverHTML(PL.book).replace('class="cover ', 'id="miniCover" class="cover ');
  $("#miniTitle").textContent = PL.ch.title; $("#miniSub").textContent = b.title;
  $("#pCover").outerHTML = coverHTML(PL.book, "pcover").replace('class="cover ', 'id="pCover" class="cover ');
  $("#pBlur").style.background = `hsl(${b.hue ?? hueOf(b.title)} 50% 30%)`;
  $("#pTitle").textContent = PL.ch.title; $("#pSub").textContent = b.title;
  $("#pLabel").textContent = `Capitolul ${idx} din ${PL.list.length}`;
  $("#favV").innerHTML = icon("heart", !!(ST.fav||{})[PL.book]); $("#tFav").classList.toggle("on", !!(ST.fav||{})[PL.book]);
  if("mediaSession" in navigator){
    try{ navigator.mediaSession.metadata = new MediaMetadata({title: PL.ch.title, artist: b.title, album: `Sona · capitolul ${idx} din ${PL.list.length}`,
      artwork: [{src: coverArt(PL.book), sizes: "512x512", type: "image/png"}]}); }catch(e){}
  }
  renderPlayState(); renderProgress();
}
function renderPlayState(){
  const playing = !audio.paused;
  $("#miniPlay").innerHTML = icon(playing ? "pause" : "play", true);
  $("#pPlay").innerHTML = icon(playing ? "pause" : "play", true);
  $("#pPlay").setAttribute("aria-label", playing ? "Pauză" : "Redă");
  const cp = $("#contPlay"); if(cp && ST.last && ST.last.book === PL.book) cp.innerHTML = icon(playing ? "pause" : "play", true);
  const bp = $("#bPlay"); if(bp && location.hash.startsWith("#/book/") && decodeURIComponent(location.hash.slice(7)) === PL.book) render();
  try{ navigator.mediaSession.playbackState = playing ? "playing" : "paused"; }catch(e){}
}
let seeking = false;
function renderProgress(){
  const d = audio.duration || PL.ch?.dur || 0, t = audio.currentTime || 0;
  if(!seeking){ $("#seek").value = d ? Math.round(t/d*1000) : 0; }
  $("#seek").style.setProperty("--p", (d ? t/d*100 : 0) + "%");
  $("#tCur").textContent = fmtClock(seeking ? $("#seek").value/1000*d : t);
  $("#tLeft").textContent = "-" + fmtClock(d - (seeking ? $("#seek").value/1000*d : t));

/* read-along text */
async function loadTranscript(){
  const r = $("#reader"); r.innerHTML = `<p style="color:var(--muted)">Se încarcă textul…</p>`; PL.cues = []; PL.spans = [];
  const ch = PL.ch;
  try{
    const data = await B.transcript(PL.book, ch);
    if(PL.ch !== ch) return;
    let html = "";
    for(const b of data.blocks || []){
      const inner = b.s.map(s => { PL.cues.push(s.t); return `<span data-i="${PL.cues.length-1}">${esc(s.o)}</span>`; }).join(" ");
      html += b.k === "h" ? `<h3>${inner}</h3>` : `<p>${inner}</p>`;
    }
    r.innerHTML = html; r.style.fontSize = prefs().textSize + "px";
    PL.spans = [...r.querySelectorAll("span")]; PL.curIdx = -1; highlight(true);
  }catch(e){ r.innerHTML = `<p style="color:var(--muted)">Textul nu e disponibil pentru acest capitol.</p>`; }
}
$("#reader").addEventListener("click", e => { const s = e.target.closest("span[data-i]"); if(!s) return; audio.currentTime = PL.cues[+s.dataset.i] + 0.01; if(audio.paused) audio.play(); });
["touchstart","wheel"].forEach(ev => $("#reader").addEventListener(ev, () => PL.userScroll = Date.now(), {passive: true}));
function highlight(force){
  if(!PL.cues.length) return;
  const t = audio.currentTime + 0.15; let lo = 0, hi = PL.cues.length - 1;
  while(lo < hi){ const mid = (lo + hi + 1) >> 1; if(PL.cues[mid] <= t) lo = mid; else hi = mid - 1; }
  if(lo === PL.curIdx && !force) return;
  const prev = PL.curIdx; PL.curIdx = lo;
  if(prev >= 0 && PL.spans[prev]) PL.spans[prev].classList.remove("cur");
  if(force){ PL.spans.forEach((s, i) => s.classList.toggle("read", i < lo)); }
  else if(prev >= 0 && PL.spans[prev]) PL.spans[prev].classList.add("read");
  const s = PL.spans[lo]; if(!s) return; s.classList.add("cur"); s.classList.remove("read");
  if($("#player").classList.contains("text") && Date.now() - PL.userScroll > 4000){
    const r = $("#reader"); r.scrollTo({top: s.offsetTop - r.clientHeight * 0.35, behavior: force ? "auto" : "smooth"});
  }
}

      <div class="or"><span>sau cu email</span></div>`}
      <form id="f">
        ${B.mode === "local" ? `<label class="field"><input id="name" placeholder="Numele tău" autocomplete="name" required></label>` : `
        ${mode === "up" ? `<label class="field"><input id="name" placeholder="Numele tău" autocomplete="name"></label>` : ""}
        <label class="field"><input id="email" type="email" placeholder="Email" autocomplete="email" required></label>
        <label class="field"><input id="pass" type="password" placeholder="Parolă" autocomplete="${mode === "in" ? "current-password" : "new-password"}" required minlength="6"></label>`}
        <div class="err" id="err"></div>
        <button class="btn primary" type="submit">${mode === "in" ? "Intră" : "Creează cont"}</button>
      </form>
      ${B.mode === "local" ? "" : `<div class="alt">${mode === "in" ? `Nu ai cont? <a href="#" class="linkbtn" id="sw">Creează unul</a><br><a href="#" class="linkbtn" id="reset" style="font-weight:500;font-size:14px;display:inline-block;margin-top:12px">Am uitat parola</a>`
        : `Ai deja cont? <a href="#" class="linkbtn" id="sw">Intră</a>`}</div>`}</div>`;
    const g = $("#google"); if(g) g.onclick = async () => { $("#err").textContent = ""; g.disabled = true;
      try{ await B.google(); }catch(err){ $("#err").textContent = err.code === "auth/popup-closed-by-user" ? "" : authErr(err); g.disabled = false; } };
    const sw = $("#sw"); if(sw) sw.onclick = e => { e.preventDefault(); mode = mode === "in" ? "up" : "in"; draw(); };
    const rs = $("#reset"); if(rs) rs.onclick = async e => { e.preventDefault(); const em = $("#email").value.trim(); if(!em){ $("#err").textContent = "Scrie emailul mai sus, apoi apasă din nou."; return; }
      try{ await B.resetPassword(em); $("#err").textContent = "Ți-am trimis un email pentru resetarea parolei."; }catch(err){ $("#err").textContent = authErr(err); } };
    $("#f").onsubmit = async e => {
      e.preventDefault(); $("#err").textContent = ""; const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
      try{
        if(B.mode === "local") await B.signIn($("#name").value.trim());
        else if(mode === "in") await B.signIn($("#email").value.trim(), $("#pass").value);
        else await B.signUp($("#email").value.trim(), $("#pass").value, ($("#name")?.value || "").trim());
        if(B.mode === "local") onUser(store.get("ab_local_user"));
      }catch(err){ $("#err").textContent = authErr(err); btn.disabled = false; }
    };
  };
  draw();
}
function authErr(e){
  const m = {"auth/invalid-credential":"Email sau parolă greșită.","auth/wrong-password":"Email sau parolă greșită.","auth/user-not-found":"Nu există cont cu acest email.",
    "auth/email-already-in-use":"Există deja un cont cu acest email. Intră în el.","auth/weak-password":"Parola trebuie să aibă cel puțin 6 caractere.",
    "auth/invalid-email":"Emailul nu pare corect.","auth/network-request-failed":"Nu e conexiune la internet.","auth/too-many-requests":"Prea multe încercări. Mai încearcă peste câteva minute.",
    "auth/popup-blocked":"Browserul a blocat fereastra Google. Permite ferestrele pop-up și apasă din nou."};
  return m[e.code] || e.message || String(e);
}

/* pull down at the top of a page to refresh */
async function refreshAll(){
  if(audio.paused){ persist(true); await sleep(250); location.reload(); return; }   // full refresh, picks up a new app version too
  try{ const [b, s] = await Promise.all([B.books(), B.state()]); BOOKS = b || {}; ST = s || {}; render(); toast("Actualizat"); }
  catch(e){ toast("Nu s-a putut actualiza. Verifică internetul."); }
}
(function pullToRefresh(){
  const ind = $("#ptr"); ind.innerHTML = icon("refresh");
  let startY = null, dy = 0, busy = false;
  const blocked = () => busy || !USER || window.scrollY > 0 || $("#player").classList.contains("open") || $("#sheet").classList.contains("open");
  window.addEventListener("touchstart", e => { startY = blocked() ? null : e.touches[0].clientY; dy = 0; }, {passive: true});
  window.addEventListener("touchmove", e => {
    if(startY == null) return;
    if(window.scrollY > 0){ startY = null; return; }
    dy = Math.max(0, e.touches[0].clientY - startY);
    const d = Math.min(dy * 0.5, 90);
    ind.style.transition = "none"; ind.style.opacity = Math.min(1, d / 50);
    ind.style.transform = `translate(-50%, ${d - 60}px) rotate(${d * 4}deg)`;
  }, {passive: true});
  window.addEventListener("touchend", async () => {
    if(startY == null) return;
    const d = Math.min(dy * 0.5, 90); startY = null; ind.style.transition = "";
    if(d >= 60){
      busy = true; ind.classList.add("spin"); ind.style.opacity = 1; ind.style.transform = "translate(-50%, 14px)";
      await refreshAll(); busy = false; ind.classList.remove("spin");
    }
    ind.style.opacity = 0; ind.style.transform = "translate(-50%, -70px)";
  });
})();

/* =====================================================================
   Router
   ===================================================================== */
function render(){
  if(!USER) return;
  const [ , tab = "home", arg] = (location.hash || "#/home").split("/");
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab || (tab === "book" && a.dataset.tab === "library")));
  if(tab === "library") viewLibrary(); else if(tab === "book") viewBook(decodeURIComponent(arg || ""));
  else if(tab === "history") viewHistory(); else if(tab === "profile") viewProfile(); else viewHome();
}
window.addEventListener("hashchange", () => { closeSheet(); render(); window.scrollTo(0, 0); });
const tabsEl = $("#tabs");
tabsEl.querySelector('[data-tab="home"]').innerHTML = icon("home") + "Acasă";
tabsEl.querySelector('[data-tab="library"]').innerHTML = icon("lib") + "Bibliotecă";
tabsEl.querySelector('[data-tab="history"]').innerHTML = icon("hist") + "Istoric";
tabsEl.querySelector('[data-tab="profile"]').innerHTML = icon("user") + "Profil";

async function onUser(u){
  USER = u;
  if(!u){ viewLogin(); return; }
  root.innerHTML = `<div class="loading">Se încarcă biblioteca…</div>`;
  try{ [BOOKS, ST] = await Promise.all([B.books(), B.state()]); }
  catch(e){
    if(B.claimAdminIfNone && !onUser.claimed){ onUser.claimed = true;
      try{ if(await B.claimAdminIfNone()) return onUser(u); }catch(err){} }
    // signed in, but not approved yet: leave a request for the admin
    try{ await B.requestAccess(u.name); }catch(err){}
    root.innerHTML = `<div class="login"><img class="logo" src="icon-192.png" alt=""><h1>Aproape gata</h1>
      <p class="sub">Contul <b>${esc(u.email || "")}</b> a fost creat. Am trimis o cerere de acces — după ce e aprobată, apasă „Verifică din nou”.</p>
      <button class="btn primary" id="again">Verifică din nou</button>
      <div class="alt"><a href="#" class="linkbtn" id="lo">Ieși din cont</a></div></div>`;
    $("#again").onclick = () => onUser(u);
    $("#lo").onclick = async ev => { ev.preventDefault(); await B.signOut(); location.reload(); }; return;
  }
  USER.admin = B.isAdmin ? await B.isAdmin().catch(() => false) : false;
  BOOKS = BOOKS || {}; ST = ST || {};
  tabsEl.classList.remove("hidden");
  audio.playbackRate = prefs().speed; $("#speedV").textContent = fmtSpeed(prefs().speed);
  skipIcons(); renderSleep(); setTextMode(PL.textOn); $("#player").classList.remove("open");
  render();
  // restore the mini player where you left off (paused)
  if(ST.last && BOOKS[ST.last.book] && !PL.ch){ const r = resumePoint(ST.last.book); if(r) playChapter(ST.last.book, r.ch.id, {t: r.t, autoplay: false}); }
}

(async function start(){
  setupMediaSession();
  const cfg = window.FB_CONFIG;
  if(!LOCAL && !(cfg && cfg.apiKey)){
    // online copy without its settings (old link or failed download): never fall back to Mac mode
    root.innerHTML = `<div class="login"><img class="logo" src="icon-192.png" alt=""><h1>Sona</h1>
      <p class="sub">Nu s-au putut încărca setările. Deschide adresa <b>drg2121.github.io/sona</b> și verifică internetul.</p>
      <a class="btn primary" href="https://drg2121.github.io/sona/" style="text-decoration:none">Deschide Sona</a></div>`;
    return;
  }
  B = LOCAL ? LocalBackend() : await FirebaseBackend(cfg);
  B.init(onUser);
  if("serviceWorker" in navigator && isSecureContext && !LOCAL) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
